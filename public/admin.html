
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Página de Administração</h1>

    <h2>Deletar Usuários</h2>

    <label>CPF:</label>
    <input type="text" id="identificadorCPF" placeholder="Digite o CPF">

    <input type="button" onclick="deletarDados()" value="Deletar">

    <br><br>

    <h2>Editar e Buscar Dados</h2>

    <label>CPF:</label>
    <input type="text" id="cpfBuscar" placeholder="Digite o CPF">

    <button onclick="buscarDados()">Buscar</button>

    <br><br>

    <label>ID:</label>
    <input type="text" id="identificador" disabled>

    <br><br>

    <label>Nome:</label>
    <input type="text" id="nomeAtualizar">

    <br><br>

    <label>Sobrenome:</label>
    <input type="text" id="sobrenomeAtualizar">

    <br><br>

    <label>Idade:</label>
    <input type="number" id="idadeAtualizar">

    <br><br>

    <label>CPF:</label>
    <input type="text" id="cpfAtualizar">

    <br><br>

    <label>RG:</label>
    <input type="text" id="rgAtualizar">

    <br><br>

    <label>E-mail:</label>
    <input type="text" id="emailAtualizar">

    <br><br>

    <label>Senha:</label>
    <input type="password" id="senhaAtualizar">

    <br><br>

    <label>Rua:</label>
    <input type="text" id="ruaAtualizar">

    <br><br>

    <label>Número da casa:</label>
    <input type="number" id="nCasaAtualizar">

    <br><br>

    <label>CEP:</label>
    <input type="text" id="cepAtualizar">

    <br><br>

    <label>Bairro:</label>
    <input type="text" id="bairroAtualizar">

    <br><br>

    <label>Cidade:</label>
    <input type="text" id="cidadeAtualizar">

    <br><br>

    <label>Estado:</label>
    <input type="text" id="estadoAtualizar">

    <br><br>

    <label>Telefone:</label>
    <input type="text" id="telefoneAtualizar">

    <br><br>

    <button onclick="atualizarDados()">Atualizar</button>

    <br><br>

    <h2>Usuários Cadastrados</h2>

    <table>
        <thead>
            <tr>
                <td>Nome</td>
                <td>Sobrenome</td>
                <td>CPF</td>
                <td>E-mail</td>
                <td>Rua</td>
                <td>CEP</td>
                <td>Cidade</td>
                <td>Estado</td>
                <td>Telefone</td>
            </tr>
        </thead>

        <tbody id="tabela-corpo"></tbody>
    </table>

    <br><br>

    <a href="index.html">Sair</a>

    <script src="delete.js"></script>
    <script src="get.js"></script>
    <script src="put.js"></script>

</body>
</html>
